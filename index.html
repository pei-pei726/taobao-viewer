<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的淘寶歷史購物清單</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.sticky-col{position:sticky;left:0;background:#fff;z-index:10}thead .sticky-col{background:#f9fafb;z-index:20}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-2 sm:p-8">
<div class="max-w-6xl mx-auto">
<header class="mb-6 text-center"><h1 class="text-2xl sm:text-3xl font-bold text-orange-600 mb-1">📦 我的淘寶歷史購物清單</h1><p class="text-xs sm:text-sm text-gray-500">自選分類（PEI／亂亂買）・依訂單日期換算歷史匯率 ☁️</p></header>
<div class="bg-white p-4 sm:p-6 rounded-xl shadow-md mb-6 border-2 border-dashed border-orange-200 text-center">
<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" class="block w-full max-w-md mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer mb-3">
<p class="text-xs text-gray-400 mb-2">多次上傳自動合併、不重複匯入；商品名稱及款式自動轉為臺灣繁體</p>
<p id="status" role="status" class="text-xs text-gray-600 mb-3">正在初始化…</p>
<button id="reconvertBtn" class="text-xs bg-orange-50 text-orange-700 px-3 py-1.5 rounded-lg hover:bg-orange-100 mr-2">🔄 轉換現有資料為繁體</button>
<button id="clearBtn" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">🗑️ 清除雲端所有資料</button>
</div>
<div id="dashboard" class="hidden">
<div class="mb-4"><div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 max-w-xs"><p class="text-xs sm:text-sm text-gray-500">有效商品總筆數</p><p id="totalCount" class="text-xl sm:text-2xl font-bold">0 筆</p></div></div>
<div class="mb-4 flex flex-col sm:flex-row gap-3"><input id="searchInput" type="text" placeholder="🔍 輸入關鍵字搜尋商品…" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white text-sm"><select id="categoryFilter" class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-sm"><option value="亂亂買" selected>亂亂買</option><option value="PEI">PEI</option><option value="ALL">全部分類</option></select></div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100"><div class="overflow-x-auto"><table class="w-full text-left border-collapse text-xs sm:text-sm min-w-[500px] table-fixed"><thead><tr class="bg-gray-50 border-b border-gray-100 font-semibold text-gray-
