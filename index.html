<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的淘寶歷史購物清單</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.sticky-col{position:sticky;left:0;background:#fff;z-index:10}thead .sticky-col{background:#f9fafb;z-index:20}
</style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-2 sm:p-8">
<div class="max-w-6xl mx-auto">
<header class="mb-6 text-center"><h1 class="text-2xl sm:text-3xl font-bold text-orange-600 mb-1">📦 我的淘寶歷史購物清單</h1><p class="text-xs sm:text-sm text-gray-500">自選分類（PEI／亂亂買）・依訂單日期換算歷史匯率 ☁️</p></header>
<div class="bg-white p-4 sm:p-6 rounded-xl shadow-md mb-6 border-2 border-dashed border-orange-200 text-center">
<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" class="block w-full max-w-md mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer mb-3">
<p class="text-xs text-gray-400 mb-2">多次上傳自動合併、不重複匯入；商品名稱及款式自動轉為臺灣繁體</p>
<p id="status" role="status" class="text-xs text-gray-600 mb-3">正在初始化…</p>
<button id="reconvertBtn" class="text-xs bg-orange-50 text-orange-700 px-3 py-1.5 rounded-lg hover:bg-orange-100 mr-2">🔄 轉換現有資料為繁體</button>
<button id="clearBtn" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">🗑️ 清除雲端所有資料</button>
</div>
<div id="dashboard" class="hidden">
<div class="mb-4"><div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 max-w-xs"><p class="text-xs sm:text-sm text-gray-500">有效商品總筆數</p><p id="totalCount" class="text-xl sm:text-2xl font-bold">0 筆</p></div></div>
<div class="mb-4 flex flex-col sm:flex-row gap-3"><input id="searchInput" type="text" placeholder="🔍 輸入關鍵字搜尋商品…" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white text-sm"><select id="categoryFilter" class="px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-sm"><option value="PEI" selected>PEI</option><option value="亂亂買">亂亂買</option><option value="ALL">全部分類</option></select></div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100"><div class="overflow-x-auto"><table class="w-full text-left border-collapse text-xs sm:text-sm min-w-[600px] table-fixed"><thead><tr class="bg-gray-50 border-b border-gray-100 font-semibold text-gray-500"><th class="py-3 px-2 sm:px-4 sticky-col w-2/3">商品名稱與型號款式</th><th class="py-3 px-1 text-center">分類</th><th class="py-3 px-1 text-center">數量</th><th class="py-3 px-1 text-right">人民幣</th><th class="py-3 px-1 text-right">台幣（歷史匯率）</th><th class="py-3 px-1 text-center">購買日期</th></tr></thead><tbody id="tableBody" class="divide-y divide-gray-100"></tbody></table></div></div>
</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getFirestore,doc,setDoc,getDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyD9HcDOx1hi7K4AL-HlubEmLo2HiEH7GhI',authDomain:'taboo-viewer.firebaseapp.com',projectId:'taboo-viewer',storageBucket:'taboo-viewer.firebasestorage.app',messagingSenderId:'1021068516261',appId:'1:1021068516261:web:459a135aaf85503979e64c',measurementId:'G-R93D9LLE33'};
const db=getFirestore(initializeApp(firebaseConfig));
const cloudRef=doc(db,'taobao','user_data');
const $=id=>document.getElementById(id);
const status=message=>{$('status').textContent=message;};
let allOrders=[],converter=null,working=false;
const rateCache=new Map();
const asText=v=>v==null?'':String(v);
const escapeHtml=v=>asText(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=(row,keys)=>{for(const k of keys){if(row[k]!==undefined&&row[k]!==null&&String(row[k]).trim()!=='')return row[k];}return '';};
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error(src));document.head.appendChild(s);});}
async function initOpenCC(){
  const sources=[
    'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js',
    'https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js',
    'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js'
  ];
  for(const src of sources){
    try{
      await loadScript(src);
      const lib=window.OpenCC;
      if(!lib||typeof lib.Converter!=='function')throw new Error('找不到 OpenCC.Converter');
      const candidate=lib.Converter({from:'cn',to:'tw'});
      if(typeof candidate!=='function'||candidate('软件')==='软件')throw new Error('轉換測試未通過');
      converter=candidate;return;
    }catch(e){console.warn('OpenCC 載入失敗',e);}
  }
  throw new Error('OpenCC 載入失敗，請檢查網路或 CDN 是否遭封鎖。');
}
function toTrad(v){const s=asText(v);return converter?converter(s):s;}
function normalizeOrders(orders){let changed=false;const result=orders.map(o=>{const title=toTrad(o.title),sku=toTrad(o.sku);if(title!==o.title||sku!==o.sku)changed=true;return {...o,title,sku};});return {result,changed};}
function itemKey(o){return [asText(o.id),toTrad(o.title),toTrad(o.sku),asText(o.date),asText(o.quantity)].join('\u001f');}
function formatOrderId(v){let s=asText(v).trim();if(/^[\d.]+e\+?\d+$/i.test(s)){const n=Number(s);if(Number.isFinite(n))s=n.toLocaleString('fullwide',{useGrouping:false,maximumFractionDigits:0});}return s;}
function parseMoney(v){const n=parseFloat(asText(v).replace(/[¥￥,\s]/g,''));return Number.isFinite(n)?n:0;}
function normalizeDate(v){if(typeof v==='number'&&v>10000&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}
const s=asText(v).trim().split(' ')[0].replaceAll('/','-');const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:s;}
async function fetchRate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return 4.5;if(rateCache.has(date))return rateCache.get(date);
try{const response=await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/cny.json`);if(response.ok){const data=await response.json();const rate=Number(data?.cny?.twd);if(rate>0){rateCache.set(date,rate);return rate;}}}catch(e){console.warn('歷史匯率取得失敗',date,e);}rateCache.set(date,4.5);return 4.5;}
async function saveCloud(){await setDoc(cloudRef,{orders:allOrders});}
async function loadCloud(){const snap=await getDoc(cloudRef);allOrders=Array.isArray(snap.data()?.orders)?snap.data().orders:[];const normalized=normalizeOrders(allOrders);allOrders=normalized.result;updateUI();if(normalized.changed){await saveCloud();status(`已自動轉換並同步 ${allOrders.length} 筆歷史商品資料。`);}else status(`載入完成，共 ${allOrders.length} 筆商品；繁體轉換已啟用。`);}
function getAppUrl(original){const link=asText(original).trim();if(!link||link==='#')return '#';try{const normalized=link.startsWith('//')?'https:'+link:link;const url=new URL(normalized);if(!['http:','https:'].includes(url.protocol))return '#';const id=url.searchParams.get('id')||url.searchParams.get('itemId');if(id&&/^\d+$/.test(id))return `tbopen://item.taobao.com/item.htm?id=${id}`;return `tbopen://${url.host}${url.pathname}${url.search}`;}catch{return '#';}}
function updateUI(){if(!allOrders.length){$('dashboard').classList.add('hidden');return;}$('dashboard').classList.remove('hidden');$('totalCount').textContent=`${allOrders.length} 筆`;filterAndRender();}
function filterAndRender(){const keyword=toTrad($('searchInput').value).toLowerCase();const cat=$('categoryFilter').value;renderTable(allOrders.filter(o=>(cat==='ALL'||(o.category||'PEI')===cat)&&[o.title,o.sku,o.id].some(v=>toTrad(v).toLowerCase().includes(keyword))));}
function renderTable(orders){const body=$('tableBody');body.replaceChildren();if(!orders.length){body.innerHTML='<tr><td colspan="6" class="p-6 text-center text-gray-400">沒有找到符合條件的商品</td></tr>';return;}
for(const o of orders){const rate=Number(o.rate)||4.5,amount=Number(o.amount)||0;const tr=document.createElement('tr');tr.className='hover:bg-gray-50 transition-colors';const appLink=getAppUrl(o.link);const category=o.category==='亂亂買'?'亂亂買':'PEI';const badge=category==='PEI'?'bg-purple-100 text-purple-700 border-purple-200':'bg-blue-100 text-blue-700 border-blue-200';tr.innerHTML=`<td class="py-2.5 px-2 sm:px-4 sticky-col"><a href="${escapeHtml(appLink)}" class="font-medium text-gray-800 hover:text-orange-600 line-clamp-2">${escapeHtml(toTrad(o.title))}</a>${o.sku?`<p class="text-[11px] text-orange-600 mt-0.5 font-medium">型號：${escapeHtml(toTrad(o.sku))}</p>`:''}<div class="flex items-center gap-2 mt-1"><span class="text-[10px] text-gray-400">單號：${escapeHtml(o.id)}</span><button class="copy-link-btn text-[10px] text-orange-600 bg-orange-50 hover:bg-orange-100 px-1.5 py-0.5 rounded">📋 複製連結</button></div></td><td class="py-2.5 px-1 text-center"><button class="toggle-btn px-2 py-1 rounded-md text-[11px] font-bold border ${badge}">${category}</button></td><td class="py-2.5 px-1 text-center">${escapeHtml(o.quantity)}</td><td class="py-2.5 px-1 text-right">¥${amount.toFixed(2)}</td><td class="py-2.5 px-1 text-right font-semibold text-orange-600">$${Math.round(amount*rate).toLocaleString('zh-TW')}<div class="text-[9px] text-gray-400 font-normal">@ ${rate.toFixed(2)}</div></td><td class="py-2.5 px-1 text-center text-[11px] text-gray-500 whitespace-nowrap">${escapeHtml(o.date)}</td>`;tr.querySelector('.toggle-btn').addEventListener('click',async()=>{o.category=category==='PEI'?'亂亂買':'PEI';try{await saveCloud();updateUI();}catch(e){o.category=category;updateUI();alert('分類儲存失敗：'+e.message);}});tr.querySelector('.copy-link-btn').addEventListener('click',async e=>{try{await navigator.clipboard.writeText(asText(o.link));e.currentTarget.textContent='✅ 已複製';setTimeout(()=>{if(e.currentTarget.isConnected)e.currentTarget.textContent='📋 複製連結';},1500);}catch{alert('無法複製，請確認瀏覽器已允許剪貼簿權限。');}});body.appendChild(tr);}}
async function processData(rows){const groups=new Map();let lastId='',lastDate='',lastStatus='';for(const row of rows){let id=formatOrderId(value(row,['订单号','訂單號','訂單編號','订单编号','淘宝订单号']));if(id)lastId=id;else id=lastId;if(!id)continue;let date=normalizeDate(value(row,['订单提交时间','訂單提交時間','下单时间','下單時間']));if(date)lastDate=date;else date=lastDate;let st=asText(value(row,['订单状态','訂單狀態']));if(st)lastStatus=st;else st=lastStatus;if(/交易关闭|交易關閉/.test(st))continue;
const title=toTrad(value(row,['商品名称','商品名稱','宝贝名称','寶貝名稱'])||'未知商品'),sku=toTrad(value(row,['型号款式','型號款式','颜色分类','顏色分類'])),link=asText(value(row,['商品链接','商品連結','宝贝链接','寶貝連結'])||'#'),quantity=asText(value(row,['商品数量','商品數量'])||'1'),itemAmount=parseMoney(value(row,['商品金额','商品金額','单价','單價'])),paid=parseMoney(value(row,['实付金额','實付金額','實付款','实付金额（元）'])),shipping=parseMoney(value(row,['运费','運費']));
if(!groups.has(id))groups.set(id,{date:date||'-',paid:0,shipping:0,items:[]});const g=groups.get(id);if(paid>0)g.paid=paid;if(shipping>0)g.shipping=shipping;g.items.push({id,title,sku,link,quantity,itemAmount,date:date||g.date});}
const existing=new Map(allOrders.map(o=>[itemKey(o),o]));let added=0,updated=0;for(const g of groups.values()){const sum=g.items.reduce((s,o)=>s+o.itemAmount,0);const rate=await fetchRate(g.date);for(let i=0;i<g.items.length;i++){const item=g.items[i];let amount=sum>0&&g.paid>0?item.itemAmount/sum*g.paid:g.paid>0&&g.items.length===1?g.paid:item.itemAmount;if(i===0)amount+=g.shipping;const key=itemKey(item);const old=existing.get(key);if(old){updated++;continue;}const record={id:item.id,title:item.title,sku:item.sku,link:item.link,quantity:item.quantity,amount:Number(amount.toFixed(2)),date:item.date,rate,category:'PEI'};allOrders.push(record);existing.set(key,record);added++;}}
if(!groups.size){alert('沒有找到有效商品，請確認欄位名稱與訂單狀態。');return;}await saveCloud();updateUI();status(`匯入完成：新增 ${added} 筆，略過 ${updated} 筆已存在商品。`);alert(`匯入成功！新增 ${added} 筆，略過 ${updated} 筆重複商品。`);}
$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(working)return;working=true;$('fileInput').disabled=true;status('正在解析並合併商品…');try{if(!converter)throw new Error('繁體轉換尚未就緒，為避免儲存簡體資料，已停止匯入。');if(!window.XLSX)throw new Error('Excel 讀取套件未載入。');const data=new Uint8Array(await file.arrayBuffer());const book=XLSX.read(data,{type:'array'});const rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('Excel 檔案沒有內容。');await processData(rows);}catch(err){console.error(err);status('匯入失敗：'+err.message);alert('匯入失敗：'+err.message);}finally{working=false;$('fileInput').disabled=false;$('fileInput').value='';}});
$('reconvertBtn').addEventListener('click',async()=>{if(!converter){alert('OpenCC 尚未成功載入，請重新整理後再試。');return;}const {result,changed}=normalizeOrders(allOrders);allOrders=result;updateUI();try{if(changed)await saveCloud();status(changed?'已完成繁體轉換並更新雲端資料。':'所有已載入商品均已完成繁體轉換。');}catch(e){alert('雲端更新失敗：'+e.message);}});
$('clearBtn').addEventListener('click',async()=>{if(!confirm('確定要永久清除雲端所有歷史訂單嗎？此操作無法復原。'))return;try{await deleteDoc(cloudRef);allOrders=[];updateUI();status('已清除所有雲端訂單。');alert('已清除雲端所有資料。');}catch(e){alert('清除失敗：'+e.message);}});
$('searchInput').addEventListener('input',filterAndRender);$('categoryFilter').addEventListener('change',filterAndRender);
(async()=>{try{status('正在載入繁體轉換引擎…');await initOpenCC();status('繁體轉換引擎已啟用，正在載入雲端資料…');await loadCloud();}catch(e){console.error(e);status('❌ '+e.message);alert('初始化失敗：'+e.message+'\n請檢查網路及瀏覽器開發者工具。');}})();
</script>
</body>
</html>
